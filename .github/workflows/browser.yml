name: Build Browser APK

# ARC Browser is its own app: built only when its module changes, released under browser-v tags.
on:
  push:
    branches: [main]
    paths:
      - 'browser/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle :browser:assembleRelease --build-cache --stacktrace

      - name: Rename output
        run: cp browser/build/outputs/apk/release/browser-release.apk ARC-Browser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-v0.${{ github.run_number }}
          name: ARC Browser 0.${{ github.run_number }}
          files: ARC-Browser.apk
          make_latest: false
          body: |
            ARC Browser. Download **ARC-Browser.apk**, open it and allow installing.
            To make it your default browser: Settings → Apps → Default apps → Browser.


      # Public download mirror (architect-dna-ch/arc-releases): APK only, so the apps update without a token.
      # Needs the repo secret RELEASES_TOKEN (fine-grained, arc-releases only, Contents: read & write); skipped without it.
      - name: Mirror to public downloads
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN not set, mirror skipped"; exit 0; fi
          gh release create "browser-v0.${{ github.run_number }}" ARC-Browser.apk -R architect-dna-ch/arc-releases \
            --title "ARC Browser 0.${{ github.run_number }}" --notes "Download ARC-Browser.apk, open it and allow installing." --latest=false
          gh api "repos/architect-dna-ch/arc-releases/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("browser-v"))] | sort_by(.published_at) | reverse | .[5:] | .[].tag_name' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag -R architect-dna-ch/arc-releases || true; done

      # Keep only the 5 newest Browser releases (and their tags).
      - name: Prune old Browser releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("browser-v"))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag -R "${{ github.repository }}" || true
          done
