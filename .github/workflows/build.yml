name: Build APK

on:
  push:
    branches: [main]
    # The Statistik app has its own workflow (stats.yml); its changes don't rebuild the launcher.
    paths-ignore:
      - 'stats/**'
      - '.github/workflows/stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download MediaPipe face model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

      - name: Build release APK
        run: gradle :app:assembleRelease --build-cache --stacktrace

      - name: Rename output
        run: cp app/build/outputs/apk/release/app-release.apk ARC-DNA-Home.apk

      # The release below is what the app installs from; this copy is extra, so a full artifact
      # quota must not stop the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 2
          name: ARC-DNA-Home
          path: ARC-DNA-Home.apk

      # Small in-app update patches: from each of the last 6 releases to this build (tools/apkdelta.py).
      - name: Update patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deltas
          for tag in $(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq '[.[] | select(.tag_name | startswith("v"))][:3][].tag_name'); do
            mkdir -p "old/$tag"
            gh release download "$tag" -p ARC-DNA-Home.apk -D "old/$tag" -R "${{ github.repository }}" || continue
            python3 tools/apkdelta.py "old/$tag/ARC-DNA-Home.apk" ARC-DNA-Home.apk "deltas/delta-$tag.bin" || rm -f "deltas/delta-$tag.bin"
          done
          ls -la deltas

      - name: Final build?
        id: final
        run: |
          if git log -1 --pretty=%B | grep -q '\[final\]'; then
            echo "suffix= · FINAL" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ARC-DNA Home 1.0.${{ github.run_number }}${{ steps.final.outputs.suffix }}
          files: |
            ARC-DNA-Home.apk
            deltas/*.bin
          make_latest: true
          body: |
            Download **ARC-DNA-Home.apk** on your Pixel, open it and allow installing from this source.
            Then: Settings → Apps → Default apps → Home app → ARC-DNA.

      # A commit marked [final] also moves the "final" tag to this build.
      - name: Tag final
        if: steps.final.outputs.suffix != ''
        run: |
          git tag -f final
          git push -f origin refs/tags/final

      # Keep only the 10 newest releases (and their version tags).
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("v"))] | sort_by(.created_at) | reverse | .[10:] | .[].tag_name' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag -R "${{ github.repository }}" || true
          done
