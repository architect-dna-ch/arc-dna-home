name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download MediaPipe face model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ARC-DNA-Home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ARC-DNA-Home
          path: ARC-DNA-Home.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ARC-DNA Home 1.0.${{ github.run_number }}
          files: ARC-DNA-Home.apk
          make_latest: true
          body: |
            Download **ARC-DNA-Home.apk** on your Pixel, open it and allow installing from this source.
            Then: Settings → Apps → Default apps → Home app → ARC-DNA.
