plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ch.architectdna.home'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.architectdna.home'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"

        // Pixel 9a is arm64; leaving out the other CPU types cuts ML Kit's native code to a quarter.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Personal app in a private repo: the key lives here so every CI build
    // can be installed over the previous one.
    signingConfigs {
        release {
            storeFile file('arc-dna-home.p12')
            storePassword 'arcdnahome'
            keyAlias 'arcdna'
            keyPassword 'arcdnahome'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            // R8: shrink + rename our own code so the shipped APK/AAB is hard to reverse-engineer.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'task'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Head-nod scrolling: front camera frames + on-device face detection (bundled model, no network).
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    // ARC-DNA Kamera: preview view, plus on-device subject boxes and labels for the coach's hints.
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:object-detection:17.0.2'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.guava:listenablefuture:1.0'
    // Gaze scrolling: MediaPipe Face Landmarker (eye blendshapes). The model is fetched in CI.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
