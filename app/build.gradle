plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ch.architectdna.home'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.architectdna.home'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Personal app in a private repo: the key lives here so every CI build
    // can be installed over the previous one.
    signingConfigs {
        release {
            storeFile file('arc-dna-home.p12')
            storePassword 'arcdnahome'
            keyAlias 'arcdna'
            keyPassword 'arcdnahome'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Head-nod scrolling: front camera frames + on-device face detection (bundled model, no network).
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.guava:listenablefuture:1.0'
}
