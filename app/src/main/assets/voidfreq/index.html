<!DOCTYPE html>
<!--
  VOID FREQ inside ARC-DNA Home. The sound engine (channels, noise, drones, rain, lo-fi sequencer,
  binaural, timer chime) is VOID FREQ's own code from void-freq-ios www/index.html, unchanged; the
  interface around it is new, in the ARC-DNA editorial style (sections, cards, rust accent).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOID FREQ</title>
<style>
:root{--bg:#FAFAF8;--bg2:#F0EFEB;--card:#FFFFFF;--border:#E0E0D8;--text:#1A1A1A;--text2:#5A5A58;--text3:#9A9A98;--red:#B5271E;--grid:rgba(0,0,0,.035);
  --font:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',Roboto,sans-serif;--mono:'SF Mono','Fira Code','Roboto Mono','Courier New',monospace;--accent:var(--red)}
html.night{--bg:#121211;--bg2:#262624;--card:#1C1C1A;--border:#2C2C2A;--text:#EDEDE8;--text2:#A5A5A0;--text3:#6F6E69;--red:#D9472F;--grid:rgba(255,255,255,.035)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;
  padding:22px 22px 40px;min-height:100vh}
.label{display:flex;align-items:center;gap:14px;font:600 11px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--text3);margin:30px 0 12px}
.label::before{content:'';width:24px;height:2px;background:var(--red)}
.label .right{margin-left:auto;letter-spacing:.16em;color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;padding-right:46px}
.top .label{margin:4px 0 0}
.status{font:600 11px var(--mono);letter-spacing:.16em;color:var(--text3)}
.status.on{color:var(--accent)}
h1{font-size:54px;line-height:.95;font-weight:800;letter-spacing:-.05em;margin-top:26px}
.sub{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-top:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px}
.viz{margin-top:22px;padding:14px;position:relative}
canvas{display:block;width:100%;height:150px}
.play{position:absolute;right:14px;top:14px;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;font:700 18px var(--font);display:flex;align-items:center;justify-content:center}
.play.off{background:var(--text);color:var(--bg)}
.channels .row{display:flex;align-items:center;gap:14px;padding:16px;border-top:1px solid var(--border)}
.channels .row:first-child{border-top:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.row .what{font:11px var(--mono);letter-spacing:.08em;color:var(--text3);margin-top:3px;text-transform:uppercase}
.row .state{margin-left:auto;font:600 11px var(--mono);letter-spacing:.14em;color:var(--text3)}
.row.active{background:var(--bg2)}
.row.active .state{color:var(--accent)}
.vol{display:flex;align-items:center;gap:14px;padding:18px 16px}
.vol span{font:600 11px var(--mono);letter-spacing:.16em;color:var(--text3);min-width:36px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:none}
.timer{padding:18px 16px}
.clock{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.clock.idle{color:var(--text3)}
.bar{height:4px;border-radius:2px;background:var(--border);margin:14px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{padding:10px 4px;text-align:center;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);font:600 12px var(--mono);letter-spacing:.12em}
.chip.active{border-color:var(--accent);color:var(--accent)}
.sessions{font:11px var(--mono);letter-spacing:.14em;color:var(--text3);margin-top:22px;text-transform:uppercase}
</style>
</head>
<body>

<div class="top">
  <div class="label">VOID FREQ · Fokus</div>
  <div class="status" id="status">STILL</div>
</div>
<h1 id="title">Wähl einen<br>Kanal.</h1>
<div class="sub" id="sub">Brown noise · Regen · Drone · Lo-Fi · Binaural</div>

<div class="card viz">
  <canvas id="c"></canvas>
  <button class="play off" id="play" aria-label="Start / Stop">▶</button>
</div>

<div class="label">Kanäle</div>
<div class="card channels" id="channels"></div>

<div class="label">Lautstärke</div>
<div class="card vol"><span>VOL</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></div>

<div class="label">Timer <span class="right" id="timerState"></span></div>
<div class="card timer">
  <div class="clock idle" id="timerDisplay">--:--</div>
  <div class="bar"><i id="timerBar"></i></div>
  <div class="chips">
    <button class="chip" data-mins="5">5 MIN</button>
    <button class="chip" data-mins="25">25 MIN</button>
    <button class="chip" data-mins="50">50 MIN</button>
    <button class="chip" id="timerStop">■ STOP</button>
  </div>
</div>
<div class="sessions" id="sessionInfo"></div>

<script>
if(/[?&]night=1/.test(location.search))document.documentElement.classList.add('night');
const css=getComputedStyle(document.documentElement);
const RUST=css.getPropertyValue('--red').trim();

// ── Audio (VOID FREQ engine, unchanged) ─────────────────────────────────────
let AC,masterGain,analyser;
let activeNodes=[],lofiTimer=null,rainTimer=null;
let currentCh='',chColor=RUST;
let volume=0.7;

function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=AC.createGain();masterGain.gain.value=0;
  analyser=AC.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.88;
  masterGain.connect(analyser);analyser.connect(AC.destination);
}

function fadeGain(val,time=0.6){
  masterGain.gain.cancelScheduledValues(AC.currentTime);
  masterGain.gain.setTargetAtTime(val,AC.currentTime,time/4);
}

function stopAll(){
  fadeGain(0,0.4);
  setTimeout(()=>{
    activeNodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect();}catch(e){}});
    activeNodes=[];
    if(lofiTimer){clearInterval(lofiTimer);lofiTimer=null;}
    if(rainTimer){clearTimeout(rainTimer);rainTimer=null;}
  },500);
}

function makeNoiseBuf(type,secs=8){
  const sr=AC.sampleRate,len=sr*secs;
  const buf=AC.createBuffer(1,len,sr);
  const d=buf.getChannelData(0);
  if(type==='white'){for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
  else{let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}}
  return buf;
}

function playNoise(type,fType,fFreq,fQ=1,gain=1){
  const src=AC.createBufferSource();
  src.buffer=makeNoiseBuf(type);src.loop=true;
  const f=AC.createBiquadFilter();f.type=fType;f.frequency.value=fFreq;f.Q.value=fQ;
  const g=AC.createGain();g.gain.value=gain;
  src.connect(f);f.connect(g);g.connect(masterGain);
  src.start();activeNodes.push(src,f,g);
}

function osc(freq,type,gain,fadeIn=0.1){
  const o=AC.createOscillator();o.type=type;o.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(gain,AC.currentTime+fadeIn);
  o.connect(g);g.connect(masterGain);o.start();
  activeNodes.push(o,g);return{o,g};
}

const CHANNELS={
  focus:{name:'Deep Focus',sub:'Brown noise · 40 Hz Gamma',what:'Lange Arbeitsphasen',color:RUST,
    start(){
      playNoise('brown','lowpass',350,0.6,1);
      osc(40,'sine',0.035,2);
    }
  },
  rain:{name:'Rain Room',sub:'Gefiltertes Rauschen · Tropfen',what:'Ruhig werden, lesen',color:'#3C8DFF',
    start(){
      playNoise('white','bandpass',900,2.5,0.9);
      playNoise('white','lowpass',120,0.5,0.4);
      scheduleDrops();
    }
  },
  void:{name:'Void',sub:'Tiefer Drone · Obertöne',what:'Abschalten, tief',color:'#A77BFF',
    start(){
      [[30,0.25],[45,0.12],[60,0.08],[90,0.04],[120,0.025]].forEach(([f,g])=>osc(f,'sine',g,4));
      const sw=AC.createOscillator();sw.type='sine';sw.frequency.value=75;
      const sg=AC.createGain();sg.gain.value=0.05;
      sw.connect(sg);sg.connect(masterGain);sw.start();
      sw.frequency.setTargetAtTime(110,AC.currentTime,12);
      activeNodes.push(sw,sg);
      playNoise('brown','lowpass',60,0.3,0.15);
    }
  },
  lofi:{name:'Lo-Fi',sub:'Am7 Loop · Beat · Vinyl',what:'Locker dranbleiben',color:'#F29A1F',
    start(){
      playNoise('white','bandpass',3000,12,0.04);
      startLofi();
    }
  },
  neurons:{name:'Neurons',sub:'Binaural Alpha 10 Hz',what:'Mit Kopfhörern',color:'#2BBF6A',
    start(){
      const merger=AC.createChannelMerger(2);merger.connect(masterGain);
      [[200,0],[210,1]].forEach(([f,ch])=>{
        const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
        const g=AC.createGain();g.gain.value=0.35;
        o.connect(g);g.connect(merger,0,ch);o.start();
        activeNodes.push(o,g);
      });
      activeNodes.push(merger);
      playNoise('white','bandpass',600,0.8,0.08);
    }
  }
};

function scheduleDrops(){
  if(currentCh!=='rain')return;
  const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';
  o.frequency.value=600+Math.random()*800;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.08+Math.random()*0.12,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.025);
  o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+0.04);
  const ms=40+Math.random()*220;
  rainTimer=setTimeout(scheduleDrops,ms);
}

const BPM=72,STEP=60/BPM/2;
const CHORDS=[[220,277.2,329.6,415],[174.6,220,261.6,311.1],[261.6,329.6,392,493.9],[196,246.9,329.6,415]];
const BEAT=[
  {k:1,h:0,c:1},{k:0,h:0,c:0},{k:0,h:1,c:0},{k:0,h:0,c:0},
  {k:1,h:1,c:0},{k:0,h:0,c:0},{k:0,h:1,c:0},{k:0,h:0,c:0}
];
function startLofi(){
  let step=0,chordI=0,nextT=AC.currentTime+0.05;
  lofiTimer=setInterval(()=>{
    while(nextT<AC.currentTime+0.15){
      const b=BEAT[step%8];
      if(b.k){
        const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(80,nextT);
        o.frequency.exponentialRampToValueAtTime(28,nextT+0.07);
        const g=AC.createGain();g.gain.setValueAtTime(0.45,nextT);g.gain.exponentialRampToValueAtTime(0.001,nextT+0.11);
        o.connect(g);g.connect(masterGain);o.start(nextT);o.stop(nextT+0.15);
      }
      if(b.h){
        const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.04),AC.sampleRate);
        const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
        const src=AC.createBufferSource();src.buffer=buf;
        const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
        const g=AC.createGain();g.gain.setValueAtTime(0.18,nextT);g.gain.exponentialRampToValueAtTime(0.001,nextT+0.035);
        src.connect(f);f.connect(g);g.connect(masterGain);src.start(nextT);
      }
      if(b.c){
        const chord=CHORDS[chordI%CHORDS.length];
        chord.forEach(f=>{
          const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;
          const warp=AC.createOscillator();warp.type='sine';warp.frequency.value=0.2+Math.random()*0.2;
          const wg=AC.createGain();wg.gain.value=1.5;
          warp.connect(wg);wg.connect(o.frequency);warp.start(nextT);warp.stop(nextT+STEP*7+0.5);
          const g=AC.createGain();g.gain.setValueAtTime(0,nextT);
          g.gain.linearRampToValueAtTime(0.07,nextT+0.08);
          g.gain.setTargetAtTime(0,nextT+STEP*6,0.3);
          o.connect(g);g.connect(masterGain);o.start(nextT);o.stop(nextT+STEP*7+0.5);
        });
        chordI++;
      }
      nextT+=STEP;step++;
    }
  },25);
}

let lastCh=localStorage.getItem('vf_last')||'focus';
function playChannel(key){
  initAudio();
  if(AC.state==='suspended')AC.resume();
  if(currentCh===key){stopAll();currentCh='';fadeGain(0);render();return;}
  stopAll();
  currentCh=key;lastCh=key;localStorage.setItem('vf_last',key);
  chColor=CHANNELS[key].color;
  setTimeout(()=>{
    if(currentCh!==key)return;
    CHANNELS[key].start();
    fadeGain(volume,0.8);
  },600);
  render();
}

// ── Timer ────────────────────────────────────────────────────────────────────
let timerEnd=null,timerMins=0;
let sessions=parseInt(localStorage.getItem('vf_sessions')||'0');

function startTimer(mins){timerEnd=Date.now()+mins*60000;timerMins=mins;render();}
function stopTimer(){timerEnd=null;timerMins=0;render();}
function timerDone(){
  if(timerMins>=25){sessions++;localStorage.setItem('vf_sessions',sessions);}
  if(AC){
    [880,1100,1320].forEach((f,i)=>{
      const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
      const g=AC.createGain();
      g.gain.setValueAtTime(0.2,AC.currentTime+i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+i*0.15+0.4);
      o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*0.15);o.stop(AC.currentTime+i*0.15+0.5);
    });
  }
  stopTimer();
}

// ── Interface (ARC-DNA) ─────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const list=$('channels');
Object.keys(CHANNELS).forEach(k=>{
  const ch=CHANNELS[k],row=document.createElement('div');
  row.className='row';row.dataset.ch=k;
  row.innerHTML=`<span class="dot" style="background:${ch.color}"></span><div><div class="name">${ch.name}</div><div class="what">${ch.what}</div></div><span class="state"></span>`;
  row.addEventListener('click',()=>playChannel(k));
  list.appendChild(row);
});

function render(){
  const on=!!currentCh,ch=CHANNELS[currentCh||lastCh];
  document.documentElement.style.setProperty('--accent',on?chColor:RUST);
  $('title').innerHTML=on?ch.name:'Wähl einen<br>Kanal.';
  $('sub').textContent=on?ch.sub:'Brown noise · Regen · Drone · Lo-Fi · Binaural';
  $('status').textContent=on?'● LÄUFT':'STILL';
  $('status').classList.toggle('on',on);
  $('play').textContent=on?'■':'▶';
  $('play').classList.toggle('off',!on);
  document.querySelectorAll('.row').forEach(r=>{
    const a=r.dataset.ch===currentCh;
    r.classList.toggle('active',a);
    r.querySelector('.state').textContent=a?'■ LÄUFT':'▶';
  });
  document.querySelectorAll('.chip[data-mins]').forEach(b=>b.classList.toggle('active',+b.dataset.mins===timerMins));
  $('timerState').textContent=timerEnd?timerMins+' MIN':'';
  if(!timerEnd){$('timerDisplay').textContent='--:--';$('timerDisplay').classList.add('idle');$('timerBar').style.width='0';}
  $('sessionInfo').textContent=sessions>0?`${sessions} Fokus-Session${sessions>1?'s':''} geschafft`:'';
}

$('play').addEventListener('click',()=>playChannel(currentCh||lastCh));
$('vol').addEventListener('input',e=>{
  volume=parseFloat(e.target.value);
  if(currentCh&&AC)masterGain.gain.setTargetAtTime(volume,AC.currentTime,0.05);
});
document.querySelectorAll('.chip[data-mins]').forEach(b=>b.addEventListener('click',()=>startTimer(+b.dataset.mins)));
$('timerStop').addEventListener('click',stopTimer);

// Spectrum like the ARC-DNA music card: bars, every fourth in the accent, plus the timer.
const c=$('c'),ctx=c.getContext('2d');
let W=0,H=0;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
let frame=0;const freqBuf=new Uint8Array(256);
function draw(){
  requestAnimationFrame(draw);frame++;
  ctx.clearRect(0,0,W,H);
  const on=!!currentCh&&analyser;
  if(on)analyser.getByteFrequencyData(freqBuf);
  const bars=28,gap=4,bw=(W-(bars-1)*gap)/bars,base=H;
  const ink=css.getPropertyValue('--text3').trim();
  for(let i=0;i<bars;i++){
    const v=on?freqBuf[Math.min(255,Math.floor(Math.pow(i/bars,1.6)*200))]/255:0.05+0.03*Math.sin(frame*0.03+i*0.5);
    const h=Math.max(4,v*(H-8));
    ctx.fillStyle=(i%4===0)?(on?chColor:RUST):ink;
    ctx.globalAlpha=on?1:0.5;
    ctx.fillRect(i*(bw+gap),base-h,bw,h);
  }
  ctx.globalAlpha=1;
  if(timerEnd){
    const rem=timerEnd-Date.now();
    if(rem<=0){timerDone();return;}
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    $('timerDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    $('timerDisplay').classList.remove('idle');
    $('timerBar').style.width=(100*(1-rem/(timerMins*60000)))+'%';
  }
}
render();draw();
</script>
</body>
</html>
