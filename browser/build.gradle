plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// ARC Browser: a private web browser in the ARC look (tracker blocking, VPN check, nothing kept).
// Its own APK and package, built by .github/workflows/browser.yml, independent of the main launcher.
android {
    namespace 'ch.architectdna.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.architectdna.browser'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../app/arc-dna-home.p12')
            storePassword 'arcdnahome'
            keyAlias 'arcdna'
            keyPassword 'arcdnahome'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // WebAuthn / passkeys in WebView (SwissID, banks, Google) — off by default, switched on in BrowserActivity.
    implementation 'androidx.webkit:webkit:1.12.1'
}
