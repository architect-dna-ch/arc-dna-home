plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// ARC-DNA Statistik: the second home — a launcher that ranks apps from your usage patterns.
// Its own APK and package, built by .github/workflows/stats.yml, independent of the main launcher.
android {
    namespace 'ch.architectdna.stats'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.architectdna.stats'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../app/arc-dna-home.p12')
            storePassword 'arcdnahome'
            keyAlias 'arcdna'
            keyPassword 'arcdnahome'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
